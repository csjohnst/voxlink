repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: version-sync
        name: Check version sync (pyproject.toml ↔ PKGBUILD ↔ __init__.py)
        entry: scripts/check-version-sync.sh
        language: script
        files: (pyproject\.toml|PKGBUILD|src/voxlink/__init__\.py)
        pass_filenames: false
